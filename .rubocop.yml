AllCops:
  NewCops: enable
  Exclude:
    - 'bin/**/*'
    - 'db/**/*'
    - 'config/**/*'
    - 'node_modules/**/*'
    - 'script/**/*'
    - 'support/**/*'
    - 'tmp/**/*'
    - 'test/**/*'
    # CI installs gems here (bundler-cache), and without this RuboCop lints
    # every vendored gem -- invisible locally, minutes of red in CI.
    - 'vendor/**/*'

Style/ConditionalAssignment:
  Enabled: false
Style/StringLiterals:
  Enabled: false
Style/RedundantReturn:
  Enabled: false
Style/Documentation:
  Enabled: false
Style/WordArray:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
Style/MutableConstant:
  Enabled: false
Style/SignalException:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Style/MissingRespondToMissing:
  Enabled: false
Lint/MissingSuper:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: false
Layout/LineLength:
  Max: 120
  Exclude:
    # The system prompt is prose sent to the LLM, not code. Wrapping it means
    # editing a product-critical string for the sake of a column limit, and
    # every rewrap risks changing what the model actually reads.
    - 'app/models/message.rb'
Style/EmptyMethod:
  Enabled: false
Bundler/OrderedGems:
  Enabled: false
